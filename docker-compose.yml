# azeitona — mesmo padrão das outras apps da VPS: sem portas nem TLS aqui.
# O edge compartilhado (viniaraujo68/edge), atrás de um Cloudflare Tunnel, encaminha para azeitona-web:3000.
# Precisa da rede externa:  docker network create web
services:
  web:
    build: .
    restart: unless-stopped
    # SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, DATABASE_URL e, para o cadastro com convite, SIGNUP_CODE e
    # SUPABASE_SECRET_KEY (veja .env.example). O .env fica só na VPS.
    env_file: .env
    networks:
      web:
        aliases:
          - azeitona-web

networks:
  web:
    external: true
