# azeitona — mesmo padrão das outras apps da VPS: sem portas nem TLS aqui.
# O edge proxy compartilhado (Caddy, porta 80) encaminha azeitona.<domínio> para azeitona-web:3000,
# e o Cloudflare cuida do HTTPS. Precisa da rede externa:  docker network create web
services:
  web:
    build: .
    restart: unless-stopped
    # SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY e DATABASE_URL (veja .env.example). O .env fica só na VPS.
    env_file: .env
    networks:
      web:
        aliases:
          - azeitona-web

networks:
  web:
    external: true
